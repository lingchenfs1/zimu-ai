name: ZimuAI
options:
  bundleIdPrefix: io.github.lingchenfs1
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # App target 使用 Swift 5 语言模式（见开发计划决策 D6），ZimuCore 包使用 Swift 6
    SWIFT_VERSION: "5.0"
    # 默认本地签名（Sign to Run Locally），无需开发者账号；发布时由脚本重新签名
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

packages:
  ZimuCore:
    path: Packages/ZimuCore

targets:
  ZimuAI:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - ZimuAI.entitlements
    dependencies:
      - package: ZimuCore
    settings:
      base:
        PRODUCT_NAME: ZimuAI
        PRODUCT_BUNDLE_IDENTIFIER: io.github.lingchenfs1.ZimuAI
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: App/ZimuAI.entitlements
        ENABLE_PREVIEWS: YES

schemes:
  ZimuAI:
    build:
      targets:
        ZimuAI: all
    run:
      config: Debug
    archive:
      config: Release
