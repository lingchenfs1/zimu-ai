name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Test ZimuCore
        run: swift test --package-path Packages/ZimuCore

      - name: Build app
        run: |
          mkdir -p build
          xcodebuild \
            -project ZimuAI.xcodeproj \
            -scheme ZimuAI \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            build > build/xcodebuild.log 2>&1 || true
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
